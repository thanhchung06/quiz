@if (exercise(); as ex) {
  <main class="intro-screen">
    <h1>{{ ex.title }}</h1>
    <ul class="rules">
      <li>{{ ex.subject }} · Lớp {{ ex.grade }}</li>
      <li>{{ ex.items.length }} câu hỏi</li>
      <li>❤️ {{ strings.exercise.lives }}: {{ ex.lives === 'unlimited' ? 'Không giới hạn' : ex.lives }}</li>
      <li>⏱ {{ strings.exercise.timeLimit }}: {{ ex.timeLimitMinutes }} phút</li>
    </ul>
    <button type="button" class="start-button" (click)="start()">{{ strings.common.start }}</button>
  </main>
}
