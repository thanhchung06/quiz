<div class="shell">
  <header class="topbar">
    <button type="button" class="menu-toggle" (click)="toggleDrawer()" aria-label="Mở menu">
      <app-icon name="menu" />
    </button>
    <span class="app-title">Luyện Tập Mỗi Ngày</span>
    <button type="button" class="logout-button" (click)="logout()">
      <app-icon name="logout" />
      <span class="label-text">Đăng xuất</span>
    </button>
  </header>

  @if (drawerOpen()) {
    <div class="scrim" (click)="closeDrawer()"></div>
  }

  <nav class="sidebar" [class.open]="drawerOpen()">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeDrawer()"
        class="nav-link"
      >
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
